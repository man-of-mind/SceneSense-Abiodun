experiment_name: route_b_v3_1_clean_base_v1

training:
  input_size: [768, 432]
  amp: true
  pretrained: false
  baseline_rgb_checkpoint: ''
  checkpoint_every_epochs: 1

object_heads:
  object_classes: [vehicle, person]
  hidden_channels: 128
  max_objects_per_frame: 64
  min_gt_area_px: 12.0
  fuse_low_feature: true

fusion:
  radar_channels: 4

evaluation:
  object_score_threshold: 0.20
  topk_objects: 120
  object_nms_radius_px: 2
  match_distance_m: 3.0
  classical_radar_diagnostic: false
