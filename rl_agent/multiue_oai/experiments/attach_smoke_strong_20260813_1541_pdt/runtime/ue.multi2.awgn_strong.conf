# SceneSense RFsim AWGN profile: strong.
# Intermediate just above medium (-5 dB). Harsh/previous -2 dB can fail
# attach in this harness; strong is intended as the highest usable channel
# stress point for CARLA policy comparison.

channelmod = {
  max_chan = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    { # DL, modify on UE side
      model_name     = "rfsimu_channel_enB0"
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -4;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    { # DL, modify on UE side
      model_name     = "rfsimu_channel_enB1"
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -4;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    { # UL, modify on gNB side
      model_name     = "rfsimu_channel_ue0"
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -4;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    { # UL for the second RFsim UE, modify on gNB side
      model_name     = "rfsimu_channel_ue1"
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -4;
