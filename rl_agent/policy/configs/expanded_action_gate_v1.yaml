frontier:
  ue_counts: [1, 2, 4, 50, 100]
  deadlines_s: [0.25, 0.50]
  fps: [2, 5, 10, 15, 20]
  stress_payload_kib: [400.0]
  chunk_bytes: 60000
  c1_factor: 0.70
  capacity_statistic: max_sched_ul_mbps_per_mcs
  share_envelopes: [whole_cell_optimistic, equal_raw, equal_c1]
  nonnetwork_p95_method: accepted_v5_fast_nonuplink_plus_profile_compute_delta

evaluation:
  split: test
  controllers: [expanded_decentralized_greedy, expanded_joint_true_state_one_step_oracle]
  action_modes: [SPLIT, SKIP]
  local_status: excluded_uncalibrated
  channel_seeds: [1101, 2202, 3303]
  latency_mode: sample
  common_random_latency_by_tick: true
  groups:
    - {group_id: n2_fast, ue_count: 2, episodes: [pcarv5_fast_te01, pcarv5_fast_te02]}
    - {group_id: n2_mixed, ue_count: 2, episodes: [pcarv5_mixed_te01, pcarv5_mixed_te02]}
    - {group_id: n2_ped, ue_count: 2, episodes: [pcarv5_ped_te01, pcarv5_ped_te02]}
    - {group_id: n2_cross_a, ue_count: 2, episodes: [pcarv5_mixed_te01, pcarv5_ped_te01]}
    - {group_id: n2_cross_b, ue_count: 2, episodes: [pcarv5_mixed_te02, pcarv5_ped_te02]}
    - {group_id: n2_cross_c, ue_count: 2, episodes: [pcarv5_mixed_te01, pcarv5_ped_te02]}
    - {group_id: n2_cross_d, ue_count: 2, episodes: [pcarv5_mixed_te02, pcarv5_ped_te01]}
    - {group_id: n4_diverse, ue_count: 4, episodes: [pcarv5_mixed_te01, pcarv5_mixed_te02, pcarv5_ped_te01, pcarv5_ped_te02]}
  hard_c1:
    greedy_per_ue_budget: 0.70 * observed_cell_capacity / N
    oracle_joint_budget: 0.70 * true_cell_capacity
  expired_work_policy: no_application_queue_latest_schedule_only
  shared_queue_model: absent_queue_free_upper_bound
  maximum_greedy_aggregate_true_capacity_miss_fraction: 0.01
  primary_metric: group_equal_mean_matched_truth_reward_v5
  secondary_deadlines_s: [0.25, 0.50]

decision_gate:
  bootstrap_seed: 20260814
  bootstrap_replicates: 10000
  cluster_unit: scenario_group_mean_over_channel_seeds
  minimum_absolute_reward_lift: 0.01
  minimum_relative_reward_lift: 0.05
  maximum_worst_ue_mean_reward_regression: 0.005
  require_bootstrap_95ci_lower_above_zero: true
  require_positive_mean_lift_at_n2_and_n4: true
  positive_result: CANDIDATE_HEADROOM_BUILD_MAX_WEIGHT_NEXT
  negative_result: EXPANDED_SURROGATE_NO_GO_STOP
  invalid_result: HOLD_INVALID_QUEUE_FREE_C1_ENVELOPE
