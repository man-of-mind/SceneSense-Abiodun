  post_hoc_relabel_or_row_selection_authorized: false
  pass_use: admit_exact_16_trajectory_batch_as_replicate_0_calibration_tranche
  fail_use: retain_as_excluded_factor_smoke_fixture_only
  prohibit_double_counting_same_design_row: true
  old_capture_status: excluded_unless_it_independently_has_this_contract_and_pass_sentinel
  pass_requires:
    - exact_pinned_16_rows
    - all_8_positive_realizations_in_requested_bins
    - all_8_positive_reviewed_onsets_leave_at_least_2p9s_in_the_exact_40_sample_10hz_retention_window
    - all_8_matched_benign_nontreatment_hashes_equal_positive
    - all_positive_endpoint_statuses_typed_and_computable
    - exact_policy_feature_projection_without_forbidden_tokens
    - available_at_s_lte_decision_at_s_for_every_consumed_policy_field_on_all_16_rows
    - forbidden_gt_and_evaluation_only_canary_rejected_by_runtime_loader_on_all_16_rows
    - installed_track_structural_integrity_gates_pass_with_typed_denominators
    - static_car_truck_bus_environment_truth_captured_after_fresh_reload_before_dynamic_actor_spawn_on_all_16_rows
    - both_role_manifests_on_all_16_rows_record_and_recompute_the_capture_time_model_checkpoint_sha256
    - one_identical_frozen_model_checkpoint_sha256_is_used_by_both_roles_across_all_16_rows
    - zero_warning_actuation
    - zero_oai_execution
    - immutable_manifest_and_artifact_hashes
  next_action_on_pass: human_review_before_any_additional_calibration_tranche
  next_action_on_fail: stop_no_scaling_repair_factor_or_endpoint_contract

