schema_version: scenesense.phase2_factor_realization_smoke_config.v1
stage_id: phase2_factor_realization_smoke_v1
implementation_status: offline_contract_only_runtime_adapter_pending

# This file selects real replicate-0 calibration rows.  It is not a disposable
# toy manifest: one atomic PASS batch may be admitted into the 66-trajectory
# calibration set.  A failed/incomplete batch remains an excluded smoke fixture.
authorization:
  offline_plan_validation: true
  carla_launch: false
  oai_launch: false
  warning_parameter_selection: false
  old_15_trajectory_audit_chain: false
  remaining_calibration: false
  validation_collection: false
  test_collection: false
  controller_evaluation: false
  rl_training: false

source_design:
  manifest: phase2_map_sharing/design/phase2_suite_ab_v2/trajectory_group_manifest.csv
  manifest_sha256: c5b56fc1210a7d2e26e8cb58cc0b495fd2b649c36faa96d5c83f8726502fdf96
  manifest_schema: scenesense.phase2_suite_design_manifest.v2
  design_config: phase2_map_sharing/configs/phase2_suite_ab_design_v2.yaml
  design_config_sha256: 1211a589fad4b1e09399754f8be125cef95e394498e2ca7823da3e4e37b88bc5
  design_config_schema: scenesense.phase2_suite_design.v2
  design_id: phase2_suite_ab_v2
  selector:
    suite_id: A
    split: calibration
    replicate_suffix: r00
    geometries:
      - curbside_bus_occluded_pedestrian
      - occluded_cross_traffic_vehicle
    expected_hazard_class_by_geometry:
      curbside_bus_occluded_pedestrian: pedestrian
      occluded_cross_traffic_vehicle: vehicle
    expected_factor_realization_status: provisional_controls_pending_bounded_factor_smoke
    expected_time_to_hazard_label_status: not_scientifically_realized_until_bounded_factor_smoke
    closing_speed_bands: [low, high]
    time_to_hazard_bands: [short, long]
    scenario_roles: [controlled_positive_occlusion, matched_benign_negative]
    expected_groups: 8
    expected_trajectories: 16
    expected_positive_trajectories: 8
    expected_benign_trajectories: 8

