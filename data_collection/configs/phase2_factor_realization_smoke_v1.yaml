factor_contract:
  measurement_anchor: first_realized_onset_sample_before_recipient_intervention
  scenario_onset_control: authored_requested_hazard_onset_s_provisional_evaluation_metadata
  scenario_onset_control_policy_visibility: forbidden
  realization_gate_basis: geometry_specific_physical_kinematics_at_first_realized_onset_sample
  future_manual_holdout_trigger: route_progress_or_recipient_eta_not_absolute_episode_clock
  counterfactual_motion_basis: matched_benign_recipient_no_target_no_warning_actuation
  closing_speed_metric: pre_intervention_radial_closing_speed_mps
  horizon_metric: pre_intervention_hazard_proximity_horizon_s
  geometry_measurement_basis_required: true
  closing_speed_measurement_basis_required: true
  proximity_horizon_measurement_basis_required: true
  positive_hazard_surface_clearance_max_m_by_class:
    pedestrian: 2.5
    vehicle: 3.0
  controlled_pedestrian_speed_range_mps: [1.0, 2.0]
  target_error_policy: report_only_until_bounded_smoke_calibrates_control_to_realization
  requested_vs_realized_policy:
    positive: require_typed_realization_inside_manifest_declared_band
    benign: require_positive_reference_and_identical_nontreatment_plan_hash
  realized_metrics_required:
    - realized_hazard_onset_s
    - realized_helper_speed_mps
    - realized_recipient_speed_mps
    - realized_hazard_actor_speed_mps
    - realized_onset_driver_speed_mps
    - pre_intervention_radial_closing_speed_mps
    - pre_intervention_hazard_proximity_horizon_s
    - pre_intervention_minimum_surface_clearance_m
    - geometry_measurement_basis
    - closing_speed_measurement_basis
    - proximity_horizon_measurement_basis

installed_track_endpoint:
  endpoint_name: recipient_available_confirmed_track_margin_s
  definition: recipient_own_target_confirmation_at_s_minus_helper_target_track_recipient_available_at_s
  source_only_margin_role: explanatory_upper_bound_not_recipient_knowledge
  transport_scope: local_loopback_only_no_oai_claim
  missing_event_policy: typed_censor_or_miss_never_null_or_fabricated_time
  allowed_statuses:
    - numeric
    - ego_right_censored
    - cooperative_miss
    - both_miss
  required_positive_fields:
    - helper_source_confirmation
    - helper_track_recipient_install
    - recipient_own_confirmation
    - evaluation_horizon_s
    - endpoint_status
    - evidence_chain_sha256
  required_install_provenance:
    - contribution_id
    - source_track_id
    - recipient_map_track_id
    - published_at_s
    - installed_at_s
    - available_at_s
  monotonicity: helper_source_confirmation_at_s_lte_published_at_s_lte_installed_at_s_lte_available_at_s

policy_feature_contract:
  projection_must_be_exact: true
  raw_audit_timestamps_and_ids_are_metadata_only: true
  placement_features:
    - lagged_capacity_estimate_mbps
    - capacity_estimate_sigma_mbps
    - previous_action_code
    - previous_delivery_success
    - previous_latency_s
    - previous_loss_fraction
    - scheduler_credit_normalized
    - in_flight_bytes
    - in_flight_oldest_age_s
    - installed_map_object_count
    - installed_map_max_aoi_s
    - installed_map_max_position_sigma_m
    - installed_map_min_estimated_ttc_s
    - prior_source_track_count
    - helper_recipient_relative_x_m
    - helper_recipient_relative_y_m
    - helper_recipient_relative_vx_mps
    - helper_recipient_relative_vy_mps
    - recipient_speed_mps
    - recipient_acceleration_mps2
    - local_compute_headroom
  publication_features:
    - current_causal_track_count
    - current_min_track_confidence
    - current_min_estimated_ttc_s
    - current_min_estimated_clearance_m
    - current_max_position_sigma_m
    - recipient_state_age_s
    - scheduler_credit_normalized
    - in_flight_bytes
    - installed_map_max_aoi_s
  forbidden_feature_tokens:
    - frame_id
    - elapsed_s
    - scenario
    - trajectory
    - route
    - spawn
    - seed
    - actor_id
    - carla_actor
    - ground_truth
    - gt_
    - future
    - world_x
    - world_y
    - absolute_time
    - geometry
    - closing_speed_band
    - time_to_hazard_band
    - proximity_horizon_band
    - requested_hazard_onset
    - requested_tth
    - realized_tth

admission_gate:
  atomic_batch: true
  pass_use: admit_exact_16_trajectory_batch_as_replicate_0_calibration_tranche
  fail_use: retain_as_excluded_factor_smoke_fixture_only
  prohibit_double_counting_same_design_row: true
  old_capture_status: excluded_unless_it_independently_has_this_contract_and_pass_sentinel
  pass_requires:
    - exact_pinned_16_rows
    - all_8_positive_realizations_in_requested_bins
    - all_8_matched_benign_nontreatment_hashes_equal_positive
    - all_positive_endpoint_statuses_typed_and_computable
    - exact_policy_feature_projection_without_forbidden_tokens
    - zero_warning_actuation
    - zero_oai_execution
    - immutable_manifest_and_artifact_hashes
  next_action_on_pass: human_review_before_any_additional_calibration_tranche
  next_action_on_fail: stop_no_scaling_repair_factor_or_endpoint_contract

runtime_readiness:
  factor_adapter_status: pending_not_implemented
  recipient_install_event_status: pending_not_implemented
  policy_feature_projection_status: pending_not_implemented
  launch_wrapper_status: pending_not_implemented
  consequence: collection_blocked_even_when_offline_design_validation_passes
