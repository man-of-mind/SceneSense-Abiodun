# This file selects real replicate-0 calibration rows.  It is not a disposable
# toy manifest: one atomic PASS batch may be admitted into the 66-trajectory
# calibration set.  A failed/incomplete batch remains an excluded smoke fixture.
authorization:
  offline_plan_validation: true
  carla_launch: false
  oai_launch: false
  warning_parameter_selection: false
  old_15_trajectory_audit_chain: false
  remaining_calibration: false
  validation_collection: false
  test_collection: false
  controller_evaluation: false
  rl_training: false

