# This audits the actual runtime loader, not merely an allowlist written beside
# a wider observation dictionary. The isolated canary is rejected before a
# policy sees it and therefore never becomes a policy observation.
causal_policy_audit_contract:
  schema: scenesense.phase2_causal_policy_runtime_audit.v1
  required_on_every_real_trajectory: true
  required_stages: [placement, publication]
  consumed_field_temporal_gate: available_at_s_lte_decision_at_s
  minimum_decisions_per_stage_per_trajectory: 1
  maximum_temporal_gate_violations: 0
  forbidden_field_canary:
    required_once_per_trajectory: true
    source: evaluation_only_isolated_loader_test_not_policy_observation
    required_rejections_per_trajectory: 1
    maximum_acceptances: 0
  pass_requires:
    - exact_projector_is_the_runtime_policy_loader
    - every_consumed_field_records_available_at_s_and_decision_at_s
    - every_consumed_field_satisfies_available_at_s_lte_decision_at_s
    - forbidden_gt_or_evaluation_canary_rejected_on_each_of_the_real_16_rows
    - zero_unprojected_wider_dict_consumers

installed_track_quality_guardrails:
  status: definitions_and_structural_gates_frozen_before_exact_16
  metric_definitions:
    protocol_false_recipient_install_rate:
      numerator: recipient_installs_without_valid_source_observation_and_source_track_provenance_correspondence
      denominator: all_recipient_install_attempts
    truth_unmatched_recipient_install_rate:
      numerator: recipient_installs_not_matched_to_any_evaluation_truth_object
      denominator: all_recipient_installs
      role: report_only_evaluation_diagnostic_not_structural_failure
    duplicate_recipient_install_rate:
      numerator: repeated_recipient_installs_for_same_contribution_and_source_track
      denominator: all_recipient_installs
    source_to_recipient_track_fragmentation_rate:
      numerator: extra_recipient_track_ids_beyond_one_per_source_track_within_episode
      denominator: source_tracks_with_at_least_one_recipient_install
    recipient_map_pollution_rate:
      numerator: recipient_map_tracks_without_valid_local_or_installed_source_provenance
      denominator: all_recipient_map_tracks
  zero_exposure_policy: typed_zero_exposure_not_missing_denominator
  structural_integrity_gates:
    - every_install_has_valid_contribution_object_source_and_recipient_track_provenance
    - publish_install_available_timestamps_are_monotone_on_one_clock
    - every_metric_event_is_recomputable_from_immutable_provenance
    - zero_missing_denominators_or_untyped_zero_exposure_cases
  numeric_threshold_policy:
    exact_16_role: estimate_distributions_only
    same_16_usability_validation_authorized: false
    registration_deadline: before_any_additional_calibration_or_validation

