factor_contract:
  measurement_anchor: first_realized_onset_sample_before_recipient_intervention
  scenario_onset_control: authored_requested_hazard_onset_s_provisional_evaluation_metadata
  scenario_onset_control_policy_visibility: forbidden
  realization_gate_basis: geometry_specific_physical_kinematics_at_first_realized_onset_sample
  future_manual_holdout_trigger: route_progress_or_recipient_eta_not_absolute_episode_clock
  counterfactual_motion_basis: matched_benign_recipient_no_target_no_warning_actuation
  closing_speed_metric: pre_intervention_radial_closing_speed_mps
  horizon_metric: pre_intervention_hazard_proximity_horizon_s
  geometry_measurement_basis_required: true
  closing_speed_measurement_basis_required: true
  proximity_horizon_measurement_basis_required: true
  positive_hazard_surface_clearance_max_m_by_class:
    pedestrian: 2.5
    vehicle: 3.0
  surface_clearance_interpretation: counterfactual_predicted_conflict_proximity_zero_may_mean_predicted_obb_overlap_not_realized_collision_status
  actual_collision_gate: separate_zero_realized_collision_structural_requirement
  controlled_pedestrian_speed_range_mps: [1.0, 2.0]
  target_error_policy: report_only_until_bounded_smoke_calibrates_control_to_realization
  requested_vs_realized_policy:
    positive: require_typed_realization_inside_manifest_declared_band
    benign: require_positive_reference_and_identical_nontreatment_plan_hash
  realized_metrics_required:
    - realized_hazard_onset_s
    - realized_helper_speed_mps
    - realized_recipient_speed_mps
    - realized_hazard_actor_speed_mps
    - realized_onset_driver_speed_mps
    - pre_intervention_radial_closing_speed_mps
    - pre_intervention_hazard_proximity_horizon_s
    - pre_intervention_minimum_surface_clearance_m
    - geometry_measurement_basis
    - closing_speed_measurement_basis
    - proximity_horizon_measurement_basis

