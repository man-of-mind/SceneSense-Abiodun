  - {episode_id: pcarv3_mixed_tr02, run_group: policy_corpus_advisor_rich_v3__train__mixed__02, scenario_family: mixed_urban, scenario_variant: advisor_route_mixed, split: train, seed: 7102}
  - {episode_id: pcarv3_mixed_tr03, run_group: policy_corpus_advisor_rich_v3__train__mixed__03, scenario_family: mixed_urban, scenario_variant: advisor_route_mixed, split: train, seed: 7103}
  - {episode_id: pcarv3_mixed_tr04, run_group: policy_corpus_advisor_rich_v3__train__mixed__04, scenario_family: mixed_urban, scenario_variant: advisor_route_mixed, split: train, seed: 7104}
  - {episode_id: pcarv3_mixed_va01, run_group: policy_corpus_advisor_rich_v3__validation__mixed__01, scenario_family: mixed_urban, scenario_variant: advisor_route_mixed, split: validation, seed: 7151}
  - {episode_id: pcarv3_mixed_va02, run_group: policy_corpus_advisor_rich_v3__validation__mixed__02, scenario_family: mixed_urban, scenario_variant: advisor_route_mixed, split: validation, seed: 7152}
  - {episode_id: pcarv3_mixed_te01, run_group: policy_corpus_advisor_rich_v3__test__mixed__01, scenario_family: mixed_urban, scenario_variant: advisor_route_mixed, split: test, seed: 7191}
  - {episode_id: pcarv3_mixed_te02, run_group: policy_corpus_advisor_rich_v3__test__mixed__02, scenario_family: mixed_urban, scenario_variant: advisor_route_mixed, split: test, seed: 7192}

  - {episode_id: pcarv3_ped_tr01, run_group: policy_corpus_advisor_rich_v3__train__ped__01, scenario_family: ped_crossing, scenario_variant: close_reactive_crossing, split: train, seed: 7201}
  - {episode_id: pcarv3_ped_tr02, run_group: policy_corpus_advisor_rich_v3__train__ped__02, scenario_family: ped_crossing, scenario_variant: close_reactive_crossing, split: train, seed: 7202}
  - {episode_id: pcarv3_ped_tr03, run_group: policy_corpus_advisor_rich_v3__train__ped__03, scenario_family: ped_crossing, scenario_variant: close_reactive_crossing, split: train, seed: 7203}
  - {episode_id: pcarv3_ped_tr04, run_group: policy_corpus_advisor_rich_v3__train__ped__04, scenario_family: ped_crossing, scenario_variant: close_reactive_crossing, split: train, seed: 7204}
  - {episode_id: pcarv3_ped_va01, run_group: policy_corpus_advisor_rich_v3__validation__ped__01, scenario_family: ped_crossing, scenario_variant: close_reactive_crossing, split: validation, seed: 7251}
  - {episode_id: pcarv3_ped_va02, run_group: policy_corpus_advisor_rich_v3__validation__ped__02, scenario_family: ped_crossing, scenario_variant: close_reactive_crossing, split: validation, seed: 7252}
  - {episode_id: pcarv3_ped_te01, run_group: policy_corpus_advisor_rich_v3__test__ped__01, scenario_family: ped_crossing, scenario_variant: close_reactive_crossing, split: test, seed: 7291}
  - {episode_id: pcarv3_ped_te02, run_group: policy_corpus_advisor_rich_v3__test__ped__02, scenario_family: ped_crossing, scenario_variant: close_reactive_crossing, split: test, seed: 7292}

  - {episode_id: pcarv3_fast_tr01, run_group: policy_corpus_advisor_rich_v3__train__fast__01, scenario_family: exact_fast_convoy, scenario_variant: exact_fast_with_advisor_walkers, split: train, seed: 7301, requested_frames: 160, extra_args: [--max-frames, 160]}
  - {episode_id: pcarv3_fast_tr02, run_group: policy_corpus_advisor_rich_v3__train__fast__02, scenario_family: exact_fast_convoy, scenario_variant: exact_fast_with_advisor_walkers, split: train, seed: 7302, requested_frames: 160, extra_args: [--max-frames, 160]}
  - {episode_id: pcarv3_fast_tr03, run_group: policy_corpus_advisor_rich_v3__train__fast__03, scenario_family: exact_fast_convoy, scenario_variant: exact_fast_with_advisor_walkers, split: train, seed: 7303, requested_frames: 160, extra_args: [--max-frames, 160]}
  - {episode_id: pcarv3_fast_tr04, run_group: policy_corpus_advisor_rich_v3__train__fast__04, scenario_family: exact_fast_convoy, scenario_variant: exact_fast_with_advisor_walkers, split: train, seed: 7304, requested_frames: 160, extra_args: [--max-frames, 160]}
  - {episode_id: pcarv3_fast_va01, run_group: policy_corpus_advisor_rich_v3__validation__fast__01, scenario_family: exact_fast_convoy, scenario_variant: exact_fast_with_advisor_walkers, split: validation, seed: 7351, requested_frames: 160, extra_args: [--max-frames, 160]}
  - {episode_id: pcarv3_fast_va02, run_group: policy_corpus_advisor_rich_v3__validation__fast__02, scenario_family: exact_fast_convoy, scenario_variant: exact_fast_with_advisor_walkers, split: validation, seed: 7352, requested_frames: 160, extra_args: [--max-frames, 160]}
  - {episode_id: pcarv3_fast_te01, run_group: policy_corpus_advisor_rich_v3__test__fast__01, scenario_family: exact_fast_convoy, scenario_variant: exact_fast_with_advisor_walkers, split: test, seed: 7391, requested_frames: 160, extra_args: [--max-frames, 160]}
  - {episode_id: pcarv3_fast_te02, run_group: policy_corpus_advisor_rich_v3__test__fast__02, scenario_family: exact_fast_convoy, scenario_variant: exact_fast_with_advisor_walkers, split: test, seed: 7392, requested_frames: 160, extra_args: [--max-frames, 160]}
